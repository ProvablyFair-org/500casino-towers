name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Offline verification (no network used by the checks)
        run: python3 -I -B analysis/run_all.py --out "$RUNNER_TEMP/verify"
      - name: Negative tests
        run: python3 -I -B tests/run_negative.py
      - name: Verification log
        if: always()
        run: cat "$RUNNER_TEMP/verify/verification-log.txt"
